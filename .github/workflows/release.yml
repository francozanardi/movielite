name: release

# Triggered when you push a tag like `v0.3.0`. Runs the full test suite first;
# if anything fails, nothing gets published. On success:
#   1. Verifies pyproject.toml matches the tag
#   2. Extracts the matching section from CHANGELOG.md as release notes
#   3. Builds sdist + wheel
#   4. Publishes to PyPI via Trusted Publishing (OIDC, no API token)
#   5. Creates the GitHub Release with the built artifacts attached
#
# One-time setup required on PyPI:
#   pypi.org → project → Settings → Publishing → Add a new pending publisher:
#     owner: francozanardi
#     repo: movielite
#     workflow: release.yml
#     environment: (leave empty; no environment used here)
on:
  push:
    tags:
      - 'v*'

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the GitHub Release
      id-token: write   # needed for PyPI Trusted Publishing (OIDC)

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Verify tag matches pyproject & extract release notes
      run: |
        python .github/scripts/extract_release_info.py \
          "${GITHUB_REF_NAME}" \
          "${RUNNER_TEMP}/release_notes.md"

    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip build

    - name: Build sdist and wheel
      run: python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${GITHUB_REF_NAME}" \
          --title "${GITHUB_REF_NAME}" \
          --notes-file "${RUNNER_TEMP}/release_notes.md" \
          dist/*
