name: tests

# Reusable workflow shared by ci.yml (on push/PR) and release.yml (on tag).
# The release depends on this passing before publishing anything.
on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            ffmpeg \
            libfontconfig1 \
            libegl1

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Run tests with coverage
      run: |
        pytest --cov=src/movielite --cov-branch --cov-report=xml

    - name: Upload divergent e2e outputs on failure
      # tests/e2e/helpers.assert_matches_golden dumps the actual MP4 next to the
      # golden as _actual__<name>.mp4 on hash mismatch. Grab those for inspection.
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-actual-outputs-py${{ matrix.python-version }}
        path: tests/e2e/goldens/_actual__*
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
